spring.application.name=loan-pathfinder
server.port=8080
# Reject 700.5 for whole-number fields instead of silently truncating it (FR-001, NFR-005)
spring.jackson.deserialization.accept-float-as-int=false
# Retention period in months (Domain Model: Retention, NFR-009)
loanpathfinder.retention-months=25
